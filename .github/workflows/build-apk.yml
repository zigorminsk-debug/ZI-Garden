name: Build APK

# Автосборка APK после любых изменений кода: тесты -> aapt2/javac/d8 -> подпись -> артефакт.
on:
  push:
    branches: [ main, 'arena/**' ]
    tags: [ 'v*' ]              # тег vX.Y → версия X.Y (код X*10000+Y*1000) + GitHub Release для самообновления
    paths-ignore:
      - '**.md'
      - 'uploads/**'
      - 'pages/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'uploads/**'
      - 'pages/**'
  workflow_dispatch: {}

permissions:
  contents: write   # нужно для публикации релиза по тегу

jobs:
  build-apk:
    name: Тесты + сборка APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK (platform 34, build-tools 34.0.0)
        run: |
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
          if [ ! -f "$ANDROID_HOME/platforms/android-34/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/34.0.0/aapt2" ]; then
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            [ -x "$SDKM" ] || SDKM=sdkmanager
            yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
            "$SDKM" --sdk_root="$ANDROID_HOME" --install "platforms;android-34" "build-tools;34.0.0"
          else
            echo "android-34 и build-tools 34.0.0 уже есть в образе — пропускаю установку"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: JVM logic tests (LogicTest)
        run: bash GardenCalendar/test.sh


      - name: Sync server tests (python)
        run: cd sync-server && python3 -m unittest test_server -v

      - name: Версия сборки (автономер)
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Релиз по тегу vX.Y → name X.Y, code X*10000+Y*1000 (выше CI-диапазона)
            V="${GITHUB_REF_NAME#v}"
            MAJ="${V%%.*}"; REST="${V#*.}"; MIN="${REST%%.*}"
            echo "APP_VERSION_CODE=$(( MAJ * 10000 + MIN * 1000 ))" >> "$GITHUB_ENV"
            echo "APP_VERSION_NAME=$V" >> "$GITHUB_ENV"
          else
            # CI-сборка: растёт с каждым запуском, диапазон 17xxx (ниже релизных)
            echo "APP_VERSION_CODE=$(( 17000 + GITHUB_RUN_NUMBER ))" >> "$GITHUB_ENV"
            echo "APP_VERSION_NAME=2.5-ci$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      - name: Build & sign APK
        run: bash GardenCalendar/build.sh

      - name: APK info
        run: |
          ls -lh GardenCalendar/out/*.apk
          echo '--- badging ---'
          head -8 GardenCalendar/out/badging.txt
          echo '--- signature ---'
          head -5 GardenCalendar/out/verify.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZI-Garden-${{ env.APP_VERSION_NAME }}-apk
          path: GardenCalendar/out/ZI-Garden-csl.by-v2.5.apk
          if-no-files-found: error
          retention-days: 90

      - name: Release notes from tagged commit (on version tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: git log -1 --format=%B "$GITHUB_SHA" > release_notes.md

      - name: Create GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GardenCalendar/out/ZI-Garden-csl.by-v2.5.apk
          body_path: release_notes.md
          generate_release_notes: false

      - name: Publish update mirror to GitHub Pages (on version tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="$(cat release_notes.md)"
          APK_URL="https://github.com/zigorminsk-debug/ZI-Garden/releases/download/${TAG}/ZI-Garden-csl.by-v2.5.apk"
          PAGES_URL="https://zigorminsk-debug.github.io/ZI-Garden/app.apk"
          mkdir -p pages
          cp GardenCalendar/out/ZI-Garden-csl.by-v2.5.apk pages/app.apk
          RAW_URL="https://raw.githubusercontent.com/zigorminsk-debug/ZI-Garden/arena/01a0aa7c-zi-garden/pages/app.apk"
          TAG="$TAG" APK_URL="$APK_URL" PAGES_URL="$PAGES_URL" RAW_URL="$RAW_URL" NOTES="$NOTES" python3 - <<'PY'
          import json, os
          data = {
              "tag_name": os.environ["TAG"],
              "name": os.environ["TAG"].lstrip("v"),
              "body": os.environ.get("NOTES", "").strip() or "Автообновление приложения ZI Garden.",
              "assets": [
                  {"name": "app.apk", "browser_download_url": os.environ["PAGES_URL"]},
                  {"name": "ZI-Garden-csl.by.apk", "browser_download_url": os.environ["APK_URL"]},
                  {"name": "app-raw.apk", "browser_download_url": os.environ["RAW_URL"]},
              ],
          }
          open("pages/latest.json", "w", encoding="utf-8").write(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          PY
          git config user.name 'ZI Garden CI'
          git config user.email 'ci@github.local'
          git add pages/latest.json pages/app.apk
          git commit -m "[skip ci] зеркало обновления ${TAG} на GitHub Pages" || echo 'нет изменений — пропуск'
          for i in 1 2 3; do
            if git push origin HEAD:refs/heads/arena/01a0aa7c-zi-garden; then
              echo 'зеркало опубликовано'; break
            else
              git fetch origin arena/01a0aa7c-zi-garden && git rebase origin/arena/01a0aa7c-zi-garden
            fi
          done
